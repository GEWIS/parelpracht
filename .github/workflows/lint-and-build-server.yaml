name: Lint and build (server)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-lint:
    uses: GEWIS/actions/.github/workflows/lint-and-build-yarn.yml@v1
    with:
      node-version: "22.x"
      prepare-command: corepack enable
      lint: true
      format: true
      test: true
      build: true
      working-directory: parelpracht-server
