name: Semantic release

on:
  push:
    branches:
      - main

jobs:
  versioning:
    uses: GEWIS/actions/.github/workflows/versioning.yml@v1

  release:
    uses: GEWIS/actions/.github/workflows/docker-release.yml@4ea6ab6760d180c2262078cf557e516d01f2f4c0
    needs: versioning
    if: ${{ needs.versioning.outputs.next-version != '' }}
    with:
      projects: '["parelpracht-client", "parelpracht-server"]'
      version: ${{ needs.versioning.outputs.next-version }}
      docker-registry: 'abc.docker-registry.gewis.nl'
      docker-paths: '["crm/parelpracht/client", "crm/parelpracht/server"]'
      github-registry: 'false'
      build-args: |
        APP_VERSION=${{ needs.versioning.outputs.next-version }}
        GIT_COMMIT_HASH=${{ github.sha }}
        GIT_COMMIT_DATE=${{ github.event.head_commit.timestamp }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.SVC_GH_PARELPRACHT_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.SVC_GH_PARELPRACHT_PWD }}

  deploy:
    needs: [versioning, release]
    if: ${{ needs.versioning.outputs.next-version != '' }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      REGISTRY: abc.docker-registry.gewis.nl
      VERSION: ${{ needs.versioning.outputs.next-version }}
      OVERLAY: parelpracht/overlays/production
    steps:
      - name: Create abc-deployments token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.ABC_DEPLOYMENTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.ABC_DEPLOYMENTS_APP_PRIVATE_KEY }}
          owner: GEWIS
          repositories: abc-deployments
          permission-contents: write

      - name: Checkout abc-deployments
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: GEWIS/abc-deployments
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Install kustomize
        run: |
          curl -sSfLo kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz"
          echo "6703a3a70a0c47cf0b37694030b54f1175a9dfeb17b3818b623ed58b9dbc2a77  kustomize.tar.gz" | sha256sum -c -
          tar -xzf kustomize.tar.gz kustomize
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          rm kustomize kustomize.tar.gz

      - name: Pin production images to the released version
        run: |
          for app in client server; do
            (cd "${OVERLAY}" && kustomize edit set image "${REGISTRY}/crm/parelpracht/${app}:${VERSION}")
          done

      - name: Commit and push
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if git diff --quiet -- "${OVERLAY}/kustomization.yaml"; then
            echo "No image change to commit"
            exit 0
          fi
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)+${APP_SLUG}[bot]@users.noreply.github.com"
          git add "${OVERLAY}/kustomization.yaml"
          git commit -m "chore(parelpracht): deploy ${VERSION} to production"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
