name: Semantic release

on:
  push:
    branches:
      - main

jobs:
  versioning:
    uses: GEWIS/actions/.github/workflows/versioning.yml@v1

  release:
    uses: GEWIS/actions/.github/workflows/docker-release.yml@4ea6ab6760d180c2262078cf557e516d01f2f4c0
    needs: versioning
    if: ${{ needs.versioning.outputs.next-version != '' }}
    with:
      projects: '["parelpracht-client", "parelpracht-server"]'
      version: ${{ needs.versioning.outputs.next-version }}
      docker-registry: 'abc.docker-registry.gewis.nl'
      docker-paths: '["crm/parelpracht/client", "crm/parelpracht/server"]'
      github-registry: 'false'
      build-args: |
        APP_VERSION=${{ needs.versioning.outputs.next-version }}
        GIT_COMMIT_HASH=${{ github.sha }}
        GIT_COMMIT_DATE=${{ github.event.head_commit.timestamp }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.SVC_GH_PARELPRACHT_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.SVC_GH_PARELPRACHT_PWD }}

  deploy:
    needs: [versioning, release]
    if: ${{ needs.versioning.outputs.next-version != '' }}
    permissions: {}
    uses: GEWIS/actions/.github/workflows/deployment-update.yml@v1
    with:
      overlay: 'parelpracht/overlays/production'
      images: '["abc.docker-registry.gewis.nl/crm/parelpracht/client", "abc.docker-registry.gewis.nl/crm/parelpracht/server"]'
      tag: ${{ needs.versioning.outputs.next-version }}
    secrets:
      APP_CLIENT_ID: ${{ secrets.ABC_DEPLOYMENTS_APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.ABC_DEPLOYMENTS_APP_PRIVATE_KEY }}
